<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RID GARAGE - Periyodik Servis Takip ve Sorgulama</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #58a6ff;
            font-size: 22px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #58a6ff;
        }
        button {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #2ea043;
        }
        .result-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-item {
            margin-bottom: 12px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }
        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .label {
            color: #8b949e;
            font-weight: 500;
        }
        .value {
            color: #f0f6fc;
            font-weight: 600;
            text-align: right;
        }
        .error-msg {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #f85149;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 20px;
            display: none;
        }
        .qr-section {
            margin-top: 30px;
            border-top: 1px solid #30363d;
            padding-top: 20px;
        }
        .qr-section h3 {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .qr-box {
            background: #fff;
            padding: 10px;
            display: inline-block;
            border-radius: 8px;
        }
        .qr-box img {
            display: block;
            width: 130px;
            height: 130px;
        }
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .social-btn:hover {
            transform: scale(1.1);
        }
        .whatsapp { background: #25d366; }
        .instagram { background: #e4405f; }
        .phone { background: #1f6feb; }
    </style>
</head>
<body>

    <div class="container">
        <h1>RID GARAGE</h1>
        <div class="subtitle">Otomatik Şanzıman ve Özel Servis</div>

        <div class="search-box">
            <input type="text" id="plateInput" placeholder="Örn: 07RID07">
            <button onclick="searchPlate()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div id="errorMsg" class="error-msg">
            <i class="fa-solid fa-circle-exclamation"></i> Bu plakaya ait servis kaydı bulunamadı.
        </div>

        <div id="resultCard" class="result-card">
            <div class="result-item"><span class="label">Plaka</span><span class="value" id="resPlate">-</span></div>
            <div class="result-item"><span class="label">Müşteri Adı</span><span class="value" id="resName">-</span></div>
            <div class="result-item"><span class="label">Marka & Model</span><span class="value" id="resCar">-</span></div>
            <div class="result-item"><span class="label">Giriş Tarihi</span><span class="value" id="resDate">-</span></div>
            <div class="result-item"><span class="label">Kilometre</span><span class="value" id="resKm">-</span></div>
            <div class="result-item"><span class="label">Arıza / İşlem</span><span class="value" id="resIssue">-</span></div>
        </div>

        <div class="qr-section">
            <h3>Dükkan Servis QR Kodunuz</h3>
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://ridgarage007.github.io/ridgarage007-gmail.com/" alt="QR Kod">
            </div>
        </div>

        <div class="social-buttons">
            <a href="https://wa.me/905467230631" target="_blank" class="social-btn whatsapp" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://instagram.com" target="_blank" class="social-btn instagram" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="tel:05467230631" class="social-btn phone" title="Ara"><i class="fa-solid fa-phone"></i></a>
        </div>
    </div>

    <script>
        // Senin Google Tablondaki verileri buraya entegre ettik kanka:
        const serviceDatabase = [
            {
                plate: "07RID07",
                name: "Recep Demir",
                car: "2026 Ferarari",
                date: "05.08.2027",
                km: "87",
                issue: "Şanzıman Keçesi"
            },
            {
                plate: "07HTY07",
                name: "İlknur Hanım",
                car: "Bisiklet",
                date: "05.02.2026",
                km: "12",
                issue: "Zincir"
            }
        ];

        function searchPlate() {
            const inputVal = document.getElementById('plateInput').value.trim().toUpperCase();
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');

            if (!inputVal) return;

            const foundRecord = serviceDatabase.find(item => item.plate === inputVal);

            if (foundRecord) {
                document.getElementById('resPlate').innerText = foundRecord.plate;
                document.getElementById('resName').innerText = foundRecord.name;
                document.getElementById('resCar').innerText = foundRecord.car;
                document.getElementById('resDate').innerText = foundRecord.date;
                document.getElementById('resKm').innerText = foundRecord.km;
                document.getElementById('resIssue').innerText = foundRecord.issue;

                resultCard.style.display = 'block';
                errorMsg.style.display = 'none';
            } else {
                resultCard.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        // Enter tuşuna basınca da sorgulasın
        document.getElementById('plateInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchPlate();
            }
        });
    </script>
</body>
</html>
